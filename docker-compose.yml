# Local PostgreSQL for development: docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: torvello-postgres
    environment:
      POSTGRES_DB: torvello
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - torvello-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d torvello"]
      interval: 5s
      retries: 10

volumes:
  torvello-pgdata:
